# ══════════════════════════════════════════════════════════════════
# FlowForce V2 — Build Docker + Push ghcr.io → Watchtower deploya na VPS
#
# Dispara em push pra main quando arquivos de v2-next/ mudam.
# O Watchtower na VPS (interval=60s) detecta a nova imagem :latest
# e faz rolling update automático (zero-downtime).
# ══════════════════════════════════════════════════════════════════

name: Deploy V2 (Docker → VPS)

on:
  push:
    branches: [main]
    paths:
      - 'v2-next/**'
      - '.github/workflows/deploy-v2.yml'

  # Permite rodar manualmente pelo GitHub Actions UI
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push imagem Docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # necessário pra push no ghcr.io

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────
      - name: Checkout repositório
        uses: actions/checkout@v4

      # ── 2. Login no GitHub Container Registry ─────────────────────
      - name: Login no ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 3. Cache de camadas Docker (acelera builds) ────────────────
      - name: Configura Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 4. Build + Push ────────────────────────────────────────────
      - name: Build e push imagem
        uses: docker/build-push-action@v5
        with:
          context: ./v2-next
          file: ./v2-next/Dockerfile
          push: true
          tags: |
            ghcr.io/clhamasjr/flowforce-v2:latest
            ghcr.io/clhamasjr/flowforce-v2:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=https://motordeport.vercel.app
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # ── 5. FORÇA redeploy na VPS (fix do Watchtower que trava) ─────
      # Em vez de esperar o Watchtower (que trava aplicando updates em
      # Docker Swarm), dispara o redeploy ativamente via webhook do
      # Portainer. Configurar o secret PORTAINER_WEBHOOK (ver README).
      # Se nao configurado, nao quebra (so avisa — Watchtower segue como fallback).
      - name: Forçar redeploy (Portainer webhook)
        env:
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK }}
        run: |
          if [ -n "$WEBHOOK" ]; then
            echo "Disparando redeploy via Portainer webhook..."
            curl -fsS -X POST "$WEBHOOK" && echo "Redeploy disparado com sucesso" || echo "Webhook falhou — confira o secret PORTAINER_WEBHOOK"
          else
            echo "PORTAINER_WEBHOOK nao configurado — pulando. (Watchtower vai tentar, pode travar.)"
          fi

      # ── 6. Resumo do deploy ────────────────────────────────────────
      - name: Resumo
        run: |
          echo "## ✅ Deploy V2" >> $GITHUB_STEP_SUMMARY
          echo "**Imagem:** \`ghcr.io/clhamasjr/flowforce-v2:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "**SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Redeploy forçado via Portainer webhook (ou SSH). Sem depender do Watchtower." >> $GITHUB_STEP_SUMMARY
          echo "🌐 [flowforce.tec.br](https://flowforce.tec.br)" >> $GITHUB_STEP_SUMMARY
